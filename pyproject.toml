[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-enterprise-runner"
version = "0.1.0"
description = "Private WAN enterprise GPU video runner control repo"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wan = "wanctl.cli:main"

[tool.setuptools.packages.find]
include = ["wanctl*"]
